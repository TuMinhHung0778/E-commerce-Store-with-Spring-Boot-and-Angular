<header>
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" routerLink="/">
        <span class="brand-mark" aria-hidden="true">N</span>
        <span class="brand-text">NovaMart</span>
      </a>
      <button
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation" class="navbar-toggler"
        data-bs-target="#navbarNav" data-bs-toggle="collapse" type="button"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item">
            <a
              (click)="setActiveNavItem(0)"
              [ngClass]="{ 'active': activeNavItem === 0 }"
              class="nav-link"
              routerLink="/"
            >Home</a>
          </li>
          <li class="nav-item">
            <a
              (click)="setActiveNavItem(1)"
              [ngClass]="{ 'active': activeNavItem === 1 }"
              class="nav-link"
              routerLink="/"
            >Deals</a>
          </li>
          <li class="nav-item">
            <a
              (click)="setActiveNavItem(2)"
              [ngClass]="{ 'active': activeNavItem === 2 }"
              class="nav-link cart-link"
              routerLink="/orders"
            >
              <i class="fas fa-shopping-cart icon"></i>
              Cart
            </a>
          </li>
          <li class="nav-item">
            @if (userResponse) {
              <ng-container>
                <ng-container
                  ngbPopover="My account,Orders,Sign out"
                  popoverTitle="Account"
                  triggers="click"
                  [placement]="'bottom'"
                >
                  <a
                    class="nav-link user-link"
                    [ngbPopover]="popoverContent"
                    (click)="togglePopover($event)"
                  >
                    {{ userResponse.fullname }}
                  </a>
                  <ng-template #popoverContent>
                    <div class="popover-list">
                      <a class="popover-item" (click)="handleItemClick(0)">My account</a>
                      <a class="popover-item" (click)="handleItemClick(1)">Orders</a>
                      <a class="popover-item" (click)="handleItemClick(2)">Sign out</a>
                    </div>
                  </ng-template>
                </ng-container>
              </ng-container>
            } @else {
              <ng-container>
                <a class="nav-link sign-in-link" routerLink="/login">Sign in</a>
              </ng-container>
            }
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>
